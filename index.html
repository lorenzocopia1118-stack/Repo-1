<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>iNexo — International Logistics, Freight Forwarding, Cargo Insurance & Trade</title>
    <meta
      name="description"
      content="iNexo provides international logistics and freight forwarding by air, sea and land, plus cargo insurance, sales & representation and trading. Connecting your business to every corner of the globe."
    />
    <meta
      name="keywords"
      content="international logistics, freight forwarding, air freight, sea freight, land freight, cargo insurance, supply chain management, customs clearance, sales and representation, international trading"
    />
    <meta name="author" content="iNexo" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#00a650" />
    <!-- TODO: set to iNexo's production domain once live -->
    <link rel="canonical" href="https://www.inexo.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="iNexo" />
    <meta property="og:title" content="iNexo — International Logistics, Cargo Insurance & Trade" />
    <meta
      property="og:description"
      content="Freight forwarding by air, sea and land, cargo insurance, commercial representation and trading — connecting your business to every corner of the globe."
    />
    <meta property="og:url" content="https://www.inexo.com/" />
    <meta property="og:image" content="https://www.inexo.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="iNexo — international logistics and trade" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="iNexo — International Logistics, Cargo Insurance & Trade" />
    <meta
      name="twitter:description"
      content="Freight forwarding by air, sea and land, cargo insurance, commercial representation and trading."
    />
    <meta name="twitter:image" content="https://www.inexo.com/og-image.png" />

    <!-- Schema.org structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "iNexo",
        "legalName": "Inexo SA",
        "slogan": "Global trade, simplified.",
        "url": "https://www.inexo.com/",
        "logo": "https://www.inexo.com/og-image.png",
        "description": "International logistics and freight forwarding by air, sea and land, cargo insurance, sales & representation and trading.",
        "email": "inexotrade@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "610 Rincón",
          "addressLocality": "Montevideo",
          "addressCountry": "UY"
        },
        "areaServed": "Worldwide",
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "International Logistics", "description": "Full-scale freight forwarding and supply chain management across air, sea and land." } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Cargo Insurance", "description": "Comprehensive cargo insurance tailored to your trade routes and commodities." } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Sales & Representation", "description": "Strategic commercial representation and business development for international growth." } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Trading", "description": "A wide variety of quality products at international competitive prices." } }
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "iNexo",
        "url": "https://www.inexo.com/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
